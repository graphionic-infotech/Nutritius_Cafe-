<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B77E" />
      <stop offset="50%" stop-color="#C59B67" />
      <stop offset="100%" stop-color="#A57842" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF7F2" />
    </linearGradient>
  </defs>

  <!-- Stylized Icon (Coffee Cup + Organic Leaf Motif) -->
  <g transform="translate(10, 10)">
    <!-- Outer Circle Badge -->
    <circle cx="30" cy="30" r="28" stroke="url(#goldGrad)" stroke-width="2" fill="rgba(28, 20, 16, 0.6)"/>
    
    <!-- Steam Lines -->
    <path d="M24 16 C22 19 26 21 24 24" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 14 C28 18 32 20 30 24" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 16 C34 19 38 21 36 24" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cup Body -->
    <path d="M19 26 L41 26 C41 37 36 43 30 43 C24 43 19 37 19 26 Z" fill="none" stroke="url(#creamGrad)" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Cup Handle -->
    <path d="M41 29 C45 29 46 35 41 37" stroke="url(#creamGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Saucer / Base -->
    <path d="M16 46 C22 48 38 48 44 46" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Small Leaf Accent -->
    <path d="M30 33 C33 30 36 31 35 34 C33 36 31 34 30 33 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: Brand Name -->
  <text x="82" y="38" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#FAF7F2">
    NUTRITIUS
  </text>
  
  <!-- Subtitle: Cafe & Restaurant -->
  <text x="83" y="54" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.5" fill="#C59B67">
    CAFE &amp; RESTAURANT
  </text>

  <!-- Tagline / Location Pill -->
  <rect x="226" y="24" width="76" height="18" rx="9" fill="rgba(197, 155, 103, 0.15)" stroke="rgba(197, 155, 103, 0.4)" stroke-width="1"/>
  <text x="264" y="36.5" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" fill="#E2B77E" text-anchor="middle">
    NAVSARI
  </text>
</svg>
